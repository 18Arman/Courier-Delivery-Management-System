server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:3306}/${AUTH_DB_NAME:smartcourier_auth}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${AUTH_DB_USERNAME:root}
    password: ${AUTH_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@smartcourier.com}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
      full-name: ${BOOTSTRAP_ADMIN_NAME:System Admin}
      phone-number: ${BOOTSTRAP_ADMIN_PHONE:9999999999}

