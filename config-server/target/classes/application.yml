server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:${CONFIG_REPO_PATH:../config-repo},file:./config-repo

management:
  endpoints:
    web:
      exposure:
        include: health,info,env

springdoc:
  swagger-ui:
    path: /swagger-ui.html
