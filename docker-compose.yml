version: "3.9"

services:
  mysql-auth:
    image: mysql:8.4
    container_name: smartcourier-mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartcourier_auth
    ports:
      - "3307:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql

  mysql-delivery:
    image: mysql:8.4
    container_name: smartcourier-mysql-delivery
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartcourier_delivery
    ports:
      - "3308:3306"
    volumes:
      - mysql-delivery-data:/var/lib/mysql

  mysql-tracking:
    image: mysql:8.4
    container_name: smartcourier-mysql-tracking
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartcourier_tracking
    ports:
      - "3309:3306"
    volumes:
      - mysql-tracking-data:/var/lib/mysql

  mysql-admin:
    image: mysql:8.4
    container_name: smartcourier-mysql-admin
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartcourier_admin
    ports:
      - "3310:3306"
    volumes:
      - mysql-admin-data:/var/lib/mysql

  sonarqube-db:
    image: postgres:16
    container_name: smartcourier-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:lts-community
    container_name: smartcourier-sonarqube
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions

volumes:
  mysql-auth-data:
  mysql-delivery-data:
  mysql-tracking-data:
  mysql-admin-data:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:

