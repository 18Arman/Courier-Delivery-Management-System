services:
  mysql-auth:
    image: mysql:8.4
    container_name: smartcourier-mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartcourier_auth
    ports:
      - "3307:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql

  mysql-delivery:
    image: mysql:8.4
    container_name: smartcourier-mysql-delivery
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartcourier_delivery
    ports:
      - "3308:3306"
    volumes:
      - mysql-delivery-data:/var/lib/mysql

  mysql-tracking:
    image: mysql:8.4
    container_name: smartcourier-mysql-tracking
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartcourier_tracking
    ports:
      - "3309:3306"
    volumes:
      - mysql-tracking-data:/var/lib/mysql

  mysql-admin:
    image: mysql:8.4
    container_name: smartcourier-mysql-admin
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartcourier_admin
    ports:
      - "3310:3306"
    volumes:
      - mysql-admin-data:/var/lib/mysql

  sonarqube-db:
    image: postgres:16
    container_name: smartcourier-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:lts-community
    container_name: smartcourier-sonarqube
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: smartcourier-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  eureka-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: eureka-server
    container_name: smartcourier-eureka-server
    ports:
      - "8761:8761"

  config-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: config-server
    container_name: smartcourier-config-server
    environment:
      CONFIG_REPO_PATH: /config-repo
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on:
      - eureka-server
      - mysql-auth
      - mysql-delivery
      - mysql-tracking
      - mysql-admin
      - rabbitmq

  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
    container_name: smartcourier-auth-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      AUTH_DB_HOST: mysql-auth
      AUTH_DB_PORT: 3306
      AUTH_DB_NAME: smartcourier_auth
      AUTH_DB_USERNAME: root
      AUTH_DB_PASSWORD: root
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - config-server
      - mysql-auth

  delivery-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: delivery-service
    container_name: smartcourier-delivery-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      DELIVERY_DB_HOST: mysql-delivery
      DELIVERY_DB_PORT: 3306
      DELIVERY_DB_NAME: smartcourier_delivery
      DELIVERY_DB_USERNAME: root
      DELIVERY_DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - config-server
      - mysql-delivery
      - rabbitmq

  tracking-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: tracking-service
    container_name: smartcourier-tracking-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      TRACKING_DB_HOST: mysql-tracking
      TRACKING_DB_PORT: 3306
      TRACKING_DB_NAME: smartcourier_tracking
      TRACKING_DB_USERNAME: root
      TRACKING_DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      TRACKING_UPLOAD_DIR: /data/uploads/tracking
    ports:
      - "8083:8083"
    volumes:
      - tracking-uploads:/data/uploads/tracking
    depends_on:
      - eureka-server
      - config-server
      - mysql-tracking
      - rabbitmq

  admin-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: admin-service
    container_name: smartcourier-admin-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      ADMIN_DB_HOST: mysql-admin
      ADMIN_DB_PORT: 3306
      ADMIN_DB_NAME: smartcourier_admin
      ADMIN_DB_USERNAME: root
      ADMIN_DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - config-server
      - mysql-admin
      - rabbitmq
      - delivery-service

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
    container_name: smartcourier-api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server
      - auth-service
      - delivery-service
      - tracking-service
      - admin-service

volumes:
  mysql-auth-data:
  mysql-delivery-data:
  mysql-tracking-data:
  mysql-admin-data:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  rabbitmq-data:
  tracking-uploads:
